name: Build and Deploy Docs to S3

concurrency:
  group: s3-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Daily rebuild to pick up content changes in rocky-linux/documentation
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [deploy-docs]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build site
        run: ./scripts/build.sh

      - name: Upload to S3
        run: |
          aws s3 sync site/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=604800"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      # Search indexes are up to 30MB, which exceeds Fastly's cacheable object
      # size limit (~20MB) and S3 does not compress. Store them gzipped with
      # Content-Encoding so they cache at the edge and download ~6x faster.
      #
      # -L is required: mike publishes version aliases as symlinks (site/latest
      # -> site/10). The S3 sync follows those symlinks and uploads real
      # objects, so without -L the aliased copy is missed here and is served
      # uncompressed, which Fastly rejects with "503 Response object too large".
      - name: Compress search indexes
        run: |
          find -L site -name search_index.json -type f | while read -r f; do
            key="${f#site/}"
            gzip -9 -c "$f" > /tmp/search_index.json.gz
            aws s3 cp /tmp/search_index.json.gz "s3://${{ secrets.S3_BUCKET }}/$key" \
              --content-encoding gzip \
              --content-type application/json \
              --cache-control "public, max-age=604800" \
              --only-show-errors
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Soft purge Fastly cache
        continue-on-error: true
        run: |
          curl -X POST \
            "https://api.fastly.com/service/${{ secrets.FASTLY_SERVICE_ID }}/purge" \
            -H "Fastly-Key: ${{ secrets.FASTLY_API_TOKEN }}" \
            -H "Fastly-Soft-Purge: 1" \
            -H "Surrogate-Key: all" \
            -H "Accept: application/json"
